<!doctype html>
<!-- You, a big legacy system, a requirement, and everything you already know; then you're told to do it with AI.
     @ fig engineer step=1 ... step=5 -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../video/figs.css">
<style>
  .legacy { left: 1030px; top: 20px; width: 530px; height: 470px; border: 2px solid var(--edge); border-radius: 22px;
    background: rgba(255,255,255,0.02); padding: 56px 18px 14px; }
  .legacy .name { position: absolute; left: 24px; top: 14px; }
  .legacy-svg { width: 100%; height: 100%; }
  .legacy-svg path { fill: none; stroke: #4a515c; stroke-width: 2.5; vector-effect: non-scaling-stroke; }
  .legacy-svg rect { fill: var(--panel); stroke: var(--muted); stroke-width: 2; vector-effect: non-scaling-stroke; }
  .you { left: 450px; top: 300px; width: 180px; }
  .biz { left: 700px; top: 20px; }
  .req { left: 720px; top: 330px; flex-direction: column; align-items: flex-start; gap: 6px; padding: 18px 24px; }
  .req .lab { font-size: 24px; }
  .stack { left: 90px; top: 300px; width: 220px; height: 190px; }
  .stack .card { position: absolute; width: 190px; height: 120px; border-radius: 14px; background: var(--panel); border: 2px solid var(--edge);
    display: flex; align-items: center; justify-content: center; }
  .stack .card .mk { width: 48px; height: 48px; font-size: 28px; }
  .stack .lab { position: absolute; left: 0; top: 200px; width: 220px; text-align: center; }
  .stack.lit .lab { color: var(--teal); }
  .stack.done .mk.ok { background: var(--muted); }
  .q { font-size: 30px; }
  .ai-ask { left: 1030px; top: 545px; width: 440px; }
  .ai-ask .chip { margin-bottom: 18px; }
  .ai-ask .win { height: 150px; }
  .ai-ask .win-body { align-items: center; justify-content: center; font-size: 84px; color: var(--orange); font-weight: 600; }
</style></head>
<body><main class="stage"><div class="cv">
  <div class="ab legacy" data-step="1"><div class="name lab">legacy system</div><svg class="legacy-svg" viewBox="0 0 500 410" preserveAspectRatio="none"><path d="M60,58 Q105.0,47.0 190,38"/><path d="M60,58 Q264.0,108.5 440,43"/><path d="M60,58 Q213.0,104.0 370,178"/><path d="M60,58 Q98.0,136.5 180,273"/><path d="M190,38 Q301.0,16.0 330,68"/><path d="M190,38 Q344.0,79.5 440,43"/><path d="M190,38 Q186.0,43.0 240,148"/><path d="M190,38 Q135.5,141.0 55,288"/><path d="M190,38 Q192.0,158.5 180,273"/><path d="M330,68 Q337.0,91.0 240,148"/><path d="M330,68 Q225.5,175.0 55,288"/><path d="M440,43 Q426.0,142.5 460,208"/><path d="M440,43 Q196.5,120.5 55,288"/><path d="M440,43 Q375.0,168.5 300,308"/><path d="M100,168 Q196.0,209.0 370,178"/><path d="M100,168 Q60.5,187.0 55,288"/><path d="M370,178 Q394.0,245.0 300,308"/><path d="M370,178 Q240.5,215.5 125,363"/><path d="M370,178 Q385.0,224.5 350,373"/><path d="M55,288 Q214.5,309.0 300,308"/><path d="M55,288 Q250.5,344.0 420,318"/><path d="M55,288 Q254.5,374.5 350,373"/><path d="M180,273 Q245.0,306.0 350,373"/><path d="M300,308 Q353.0,324.5 350,373"/><rect x="30" y="40" width="60" height="36" rx="6"/><rect x="160" y="20" width="60" height="36" rx="6"/><rect x="300" y="50" width="60" height="36" rx="6"/><rect x="410" y="25" width="60" height="36" rx="6"/><rect x="70" y="150" width="60" height="36" rx="6"/><rect x="210" y="130" width="60" height="36" rx="6"/><rect x="340" y="160" width="60" height="36" rx="6"/><rect x="430" y="190" width="60" height="36" rx="6"/><rect x="25" y="270" width="60" height="36" rx="6"/><rect x="150" y="255" width="60" height="36" rx="6"/><rect x="270" y="290" width="60" height="36" rx="6"/><rect x="390" y="300" width="60" height="36" rx="6"/><rect x="95" y="345" width="60" height="36" rx="6"/><rect x="320" y="355" width="60" height="36" rx="6"/></svg></div>
  <div class="ab actor you" data-step="1"><div class="face"><i data-icon="user"></i></div>you</div>

  <svg class="wires">
    <path class="dash" d="M 870 94 C 900 180, 880 260, 850 322" data-step="2"/>
    <polyline points="838,306 850,324 864,308" data-step="2"/>
  </svg>
  <div class="ab chip biz" data-step="2"><i data-icon="building-2"></i>from the business</div>
  <div class="ab chip req" data-step="2"><span><i data-icon="ticket"></i>&nbsp; requirement</span><span class="lab">show the delivery date</span></div>

  <div class="ab stack" data-step="3">
    <div class="card" style="left:30px;top:0"></div>
    <div class="card" style="left:15px;top:22px"></div>
    <div class="card" style="left:0;top:44px"><span class="mk ok"><i data-icon="check"></i></span></div>
    <div class="lab">done before</div>
  </div>

  <div class="ab chip q" style="left:110px;top:150px" data-step="4"><i data-icon="file-code"></i>which code</div>
  <div class="ab chip q" style="left:560px;top:150px" data-step="4"><i data-icon="flask-conical"></i>how to test</div>
  <div class="ab chip q" style="left:90px;top:620px" data-step="4"><i data-icon="network"></i>what depends</div>
  <div class="ab chip q" style="left:560px;top:620px" data-step="4"><i data-icon="triangle-alert"></i>what breaks</div>

  <div class="ab ai-ask" data-step="5">
    <div class="chip hot"><i data-icon="message-square"></i>do it with AI</div>
    <div class="win"><div class="win-body">?</div></div>
  </div>
</div></main></body></html>
