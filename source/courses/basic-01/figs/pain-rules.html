<!doctype html>
<!-- Pain 3: a list of do's and don'ts; most get followed, the one you cared about most is skipped,
     and in a long chat its attention drifts away from the list.
     @ fig pain-rules step=1 ... step=4 -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../video/figs.css">
<style>
  .prog { left: 0; top: 0; display: flex; align-items: center; gap: 26px; }
  .rules { left: 0; top: 110px; width: 700px; display: flex; flex-direction: column; gap: 18px; }
  .rule { position: relative; display: flex; align-items: center; gap: 18px; height: 92px; padding: 0 26px; border-radius: 16px;
    background: var(--panel); border: 2px solid var(--edge); font-size: 34px; }
  .rule .k { font-size: 22px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600; color: var(--muted); width: 84px; flex: none; }
  .rule .star { color: var(--fg); font-size: 36px; }
  .rules.lit .rule { border-color: rgba(45, 212, 191, 0.6); }
  .rule .mk { position: absolute; right: 22px; width: 50px; height: 50px; font-size: 30px; }
  .rule .skip { position: absolute; right: 22px; display: none; }
  .at-3 .rule.cared { border: 2px dashed var(--orange); background: transparent; color: var(--orange); }
  .at-3 .rule.cared .k { color: var(--orange); }
  .at-3 .rule.cared .skip { display: block; }
  .at-4 .rules { opacity: 0.32; }
  .chat { left: 960px; top: 70px; width: 600px; height: 720px; }
  .chat .win-body { gap: 14px; }
  .chat .stub { height: 40px; border-radius: 16px; background: #272b31; flex: none; }
  .chat .stub.me { align-self: flex-end; background: #2e353d; }
  .beam { left: 0; top: 0; }
  .beam-lab { left: 700px; top: 560px; font-size: 34px; color: var(--teal); font-weight: 600; display: flex; align-items: center; gap: 12px; }
</style></head>
<body><main class="stage"><div class="cv">
  <div class="ab prog"><div class="dots"><b></b><b></b><b class="on"></b><b></b><b></b></div><span class="tag orange">Pain 3 &middot; it doesn't always follow your rules</span></div>

  <svg class="wires beam" data-step="4">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.04"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0.38"/></linearGradient></defs>
    <polygon points="700,250 700,560 960,790 960,600" fill="url(#g)" stroke="none"/>
  </svg>
  <div class="ab beam-lab" data-step="4"><i data-icon="arrow-down-right"></i>attention</div>

  <div class="ab rules" data-step="1">
    <div class="rule"><span class="k">Do</span>follow the plan<span class="mk ok marks" data-step="2"><i data-icon="check"></i></span></div>
    <div class="rule cared"><span class="k">Do</span>run the tests first <i class="star" data-icon="star"></i><span class="skip tag">skipped</span></div>
    <div class="rule"><span class="k">Don't</span>touch billing/<span class="mk ok marks" data-step="2"><i data-icon="check"></i></span></div>
    <div class="rule"><span class="k">Don't</span>rename public APIs<span class="mk ok marks" data-step="2"><i data-icon="check"></i></span></div>
    <div class="rule"><span class="k">Do</span>keep the old format<span class="mk ok marks" data-step="2"><i data-icon="check"></i></span></div>
  </div>

  <div class="ab win chat" data-step="1">
    <div class="win-bar"><i data-icon="message-square"></i> a long chat</div>
    <div class="win-body">
      <div class="stub me" style="width:60%"></div><div class="stub ai" style="width:80%"></div>
      <div class="stub me" style="width:45%"></div><div class="stub ai" style="width:72%"></div>
      <div class="stub me" style="width:55%"></div><div class="stub ai" style="width:85%"></div>
      <div class="stub me" style="width:40%"></div><div class="stub ai" style="width:68%"></div>
      <div class="stub me" style="width:58%"></div><div class="stub ai" style="width:78%"></div>
      <div class="stub me" style="width:50%"></div><div class="stub ai" style="width:70%"></div>
    </div>
  </div>
</div></main></body></html>
