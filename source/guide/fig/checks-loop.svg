<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 1004">
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#141414}
.t{font-size:21px;font-weight:bold}
.n{font-size:18px}
.k{font-size:17px;fill:#6b6b6b}
.c{font-family:Menlo,Consolas,monospace;font-size:16px;fill:#6b6b6b}
.h{font-size:16px;font-weight:bold;fill:#6b6b6b;letter-spacing:1px}
.box{fill:#f2f1ec;stroke:#141414;stroke-width:1.5}
.focus{fill:#f2f1ec;stroke:#e8590c;stroke-width:2.5}
.dat{stroke:#141414;stroke-width:1.8;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141414"/></marker></defs>

<!-- 1 person sets n -->
<text x="20" y="62" class="h">PERSON</text>
<rect x="200" y="20" width="760" height="96" rx="6" class="box"/>
<text x="218" y="50" class="t">Sets n: the passes needed in a row</text>
<text x="218" y="76" class="n">[review]=n in a prompt, or Independent review on the task page</text>
<text x="218" y="100" class="c">.task/task.json: review.n, 0 to 5</text>
<line x1="580" y1="116" x2="580" y2="144" class="dat" marker-end="url(#a)"/>

<!-- 2 review start -->
<text x="20" y="200" class="h">AGENT RUNS,</text>
<text x="20" y="222" class="h">CODE CHECKS</text>
<rect x="200" y="146" width="760" height="122" rx="6" class="box"/>
<text x="218" y="176" class="t">harness task review start</text>
<text x="218" y="202" class="n">refused, no check used: checks off, nothing to check, a run not back,</text>
<text x="218" y="226" class="n">enough passes already, checks used up</text>
<text x="218" y="252" class="n">else: snapshot, CHANGES.diff, REVIEW/round-NNN/package.md, round open</text>
<line x1="580" y1="268" x2="580" y2="296" class="dat" marker-end="url(#a)"/>

<!-- 3 call -->
<text x="20" y="338" class="h">AGENT CALLS,</text>
<text x="20" y="360" class="h">HOOK ALLOWS</text>
<rect x="200" y="298" width="760" height="96" rx="6" class="box"/>
<text x="218" y="328" class="t">The agent calls the reviewer subagent</text>
<text x="218" y="354" class="n">hook: only the reviewer, only in a task with checks on and a round open</text>
<text x="218" y="378" class="k">the call message is meant to be the package path only (a rule in text)</text>
<line x1="580" y1="394" x2="580" y2="422" class="dat" marker-end="url(#a)"/>

<!-- 4 reviewer -->
<text x="20" y="478" class="h">REVIEWER</text>
<text x="20" y="500" class="h">(OWN CONTEXT)</text>
<rect x="200" y="424" width="760" height="122" rx="6" class="focus"/>
<text x="218" y="454" class="t">The reviewer checks, in a context of its own</text>
<text x="218" y="480" class="n">reads the package, REQ.md, PLAN.md, the files, CHANGES.diff</text>
<text x="218" y="504" class="n">tools: read, search, terminal; no edit tool; no author reasoning</text>
<text x="218" y="530" class="c">VERDICT: PASS | FAIL, then "- file:line ... | basis: ..."</text>
<line x1="580" y1="546" x2="580" y2="574" class="dat" marker-end="url(#a)"/>

<!-- 5 hook records -->
<text x="20" y="630" class="h">HOOK AND</text>
<text x="20" y="652" class="h">SCRIPT</text>
<rect x="200" y="576" width="760" height="122" rx="6" class="box"/>
<text x="218" y="606" class="t">The hook saves the answer as written and closes the round</text>
<text x="218" y="632" class="n">a FAIL: findings with no real file:line are dropped; with none left,</text>
<text x="218" y="656" class="n">the check is given back (at most 2 in a round of the task)</text>
<text x="218" y="682" class="c">REVIEW/round-NNN/verdict.md</text>
<line x1="580" y1="698" x2="580" y2="726" class="dat" marker-end="url(#a)"/>

<!-- 6 code counts -->
<text x="20" y="782" class="h">CODE</text>
<rect x="200" y="728" width="760" height="96" rx="6" class="box"/>
<text x="218" y="758" class="t">Passes: PASSes in a row on the work as it is now</text>
<text x="218" y="784" class="n">one sha256 over every result file; any change sets the count to 0</text>
<text x="218" y="808" class="c">taskreview.py passes()</text>

<!-- loop back -->
<path d="M960,776 L1008,776 L1008,207 L962,207" class="dat" marker-end="url(#a)"/>
<text transform="translate(1036,700) rotate(-90)" class="k">not enough passes: fix after a FAIL, start again, new reviewer</text>

<!-- outcomes -->
<line x1="385" y1="824" x2="385" y2="872" class="dat" marker-end="url(#a)"/>
<line x1="775" y1="824" x2="775" y2="872" class="dat" marker-end="url(#a)"/>
<rect x="200" y="874" width="370" height="122" rx="6" class="box"/>
<text x="218" y="904" class="t">n passes in a row</text>
<text x="218" y="930" class="n">task promote --dry-run is let</text>
<text x="218" y="954" class="n">through; the write-back still</text>
<text x="218" y="976" class="n">waits for the person's code</text>
<rect x="590" y="874" width="370" height="122" rx="6" class="box"/>
<text x="608" y="904" class="t">Checks used up (n + 2)</text>
<text x="608" y="930" class="n">the agent stops; the person</text>
<text x="608" y="954" class="n">gives more checks, waives this</text>
<text x="608" y="976" class="n">version, or dismisses a check</text>
</svg>
