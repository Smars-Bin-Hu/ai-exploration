<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 910">
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#141414}
.n{font-size:18px}
.k{font-size:17px;fill:#6b6b6b}
.f{font-family:Menlo,Consolas,monospace;font-size:17px;fill:#141414}
.h{font-size:17px;font-weight:bold;fill:#6b6b6b;letter-spacing:1px}
.g{font-size:16px;font-weight:bold;fill:#6b6b6b}
.rule{stroke:#d6d6d2;stroke-width:1.2}
.tag{stroke-width:1.5;rx:4}
</style>

<text x="20" y="28" class="h">PATH IN THE TASK FOLDER</text>
<text x="400" y="28" class="h">WHAT IT HOLDS</text>
<text x="880" y="28" class="h">OWNER</text>
<line x1="20" y1="40" x2="1030" y2="40" stroke="#141414" stroke-width="1.5"/>

<!-- light -->
<text x="20" y="66" class="g">light tier and up</text>
<rect x="20" y="76" width="1010" height="40" fill="#f2f1ec" stroke="#e8590c" stroke-width="2.5" rx="6"/>
<text x="34" y="103" class="f">TASK.md</text>
<text x="400" y="103" class="n">the handover; the CLI sets its Status line</text>
<rect x="880" y="84" width="130" height="25" rx="4" fill="#ffffff" stroke="#141414" stroke-width="1.2"/><text x="945" y="102" class="n" text-anchor="middle">agent</text>

<!-- medium -->
<text x="20" y="146" class="g">medium tier and up</text>
<text x="34" y="180" class="f">REQ.md</text>
<text x="400" y="172" class="n">the requirement as the agent understood</text>
<text x="400" y="194" class="n">it; confirm-req fills its confirmation line</text>
<rect x="880" y="164" width="130" height="25" rx="4" fill="#ffffff" stroke="#141414" stroke-width="1.2"/><text x="945" y="182" class="n" text-anchor="middle">agent</text>
<line x1="20" y1="206" x2="1030" y2="206" class="rule"/>
<text x="34" y="234" class="f">REQ/ REF/ (INBOX/)</text>
<text x="400" y="234" class="n">the person's documents; INBOX/ once given on the page</text>
<rect x="880" y="216" width="130" height="25" rx="4" fill="#e9e9e5" stroke="#141414" stroke-width="1.2"/><text x="945" y="234" class="n" text-anchor="middle">person</text>
<line x1="20" y1="250" x2="1030" y2="250" class="rule"/>
<text x="34" y="278" class="f">LOG.md</text>
<text x="400" y="278" class="n">decisions and why, newest on top</text>
<rect x="880" y="260" width="130" height="25" rx="4" fill="#ffffff" stroke="#141414" stroke-width="1.2"/><text x="945" y="278" class="n" text-anchor="middle">agent</text>

<!-- full -->
<text x="20" y="320" class="g">full tier</text>
<text x="34" y="352" class="f">TODO.md</text>
<text x="400" y="352" class="n">steps; open ones stop delivery; close adds a note</text>
<rect x="880" y="334" width="130" height="25" rx="4" fill="#ffffff" stroke="#141414" stroke-width="1.2"/><text x="945" y="352" class="n" text-anchor="middle">agent</text>
<line x1="20" y1="368" x2="1030" y2="368" class="rule"/>
<text x="34" y="396" class="f">DEV/&lt;repo&gt;/&lt;path&gt;</text>
<text x="400" y="396" class="n">code to write back; after plan approval</text>
<rect x="880" y="378" width="130" height="25" rx="4" fill="#ffffff" stroke="#141414" stroke-width="1.2"/><text x="945" y="396" class="n" text-anchor="middle">agent</text>
<line x1="20" y1="412" x2="1030" y2="412" class="rule"/>
<text x="34" y="440" class="f">DEV/_manual/&lt;path&gt;</text>
<text x="400" y="440" class="n">code the person runs by hand</text>
<rect x="880" y="422" width="130" height="25" rx="4" fill="#ffffff" stroke="#141414" stroke-width="1.2"/><text x="945" y="440" class="n" text-anchor="middle">agent</text>
<line x1="20" y1="456" x2="1030" y2="456" class="rule"/>
<text x="34" y="484" class="f">TEST/</text>
<text x="400" y="484" class="n">test guide results, one file per environment</text>
<rect x="880" y="466" width="130" height="25" rx="4" fill="#ffffff" stroke="#141414" stroke-width="1.2"/><text x="945" y="484" class="n" text-anchor="middle">agent</text>

<!-- any tier -->
<text x="20" y="526" class="g">when the work needs them</text>
<text x="34" y="558" class="f">PLAN.md</text>
<text x="400" y="558" class="n">what changes; its digest is approved</text>
<rect x="880" y="540" width="130" height="25" rx="4" fill="#ffffff" stroke="#141414" stroke-width="1.2"/><text x="945" y="558" class="n" text-anchor="middle">agent</text>
<line x1="20" y1="574" x2="1030" y2="574" class="rule"/>
<text x="34" y="602" class="f">RCA.md, DESIGN.md, ...</text>
<text x="400" y="602" class="n">results that stay in the task; no plan</text>
<rect x="880" y="584" width="130" height="25" rx="4" fill="#ffffff" stroke="#141414" stroke-width="1.2"/><text x="945" y="602" class="n" text-anchor="middle">agent</text>

<!-- CLI only -->
<text x="20" y="644" class="g">written by harness code (the gate refuses the agent's edit tools)</text>
<text x="34" y="676" class="f">.task/task.json</text>
<text x="400" y="676" class="n">the state: status, approvals, history</text>
<rect x="880" y="658" width="130" height="25" rx="4" fill="#141414" stroke="#141414" stroke-width="1.2"/><text x="945" y="676" class="n" text-anchor="middle" style="fill:#ffffff">harness</text>
<line x1="20" y1="692" x2="1030" y2="692" class="rule"/>
<text x="34" y="720" class="f">.task/base/</text>
<text x="400" y="720" class="n">fetched files as the base branch had them</text>
<rect x="880" y="702" width="130" height="25" rx="4" fill="#141414" stroke="#141414" stroke-width="1.2"/><text x="945" y="720" class="n" text-anchor="middle" style="fill:#ffffff">CLI</text>
<line x1="20" y1="736" x2="1030" y2="736" class="rule"/>
<text x="34" y="764" class="f">.task/rewind/, transcript.jsonl</text>
<text x="400" y="764" class="n">restore points; the chat, saved at close</text>
<rect x="880" y="746" width="130" height="25" rx="4" fill="#141414" stroke="#141414" stroke-width="1.2"/><text x="945" y="764" class="n" text-anchor="middle" style="fill:#ffffff">CLI, hook</text>
<line x1="20" y1="780" x2="1030" y2="780" class="rule"/>
<text x="34" y="808" class="f">REVIEW/ SNAPSHOT/ OUTBOX/</text>
<text x="400" y="808" class="n">checks, copies at the gates, held calls</text>
<rect x="880" y="790" width="130" height="25" rx="4" fill="#141414" stroke="#141414" stroke-width="1.2"/><text x="945" y="808" class="n" text-anchor="middle" style="fill:#ffffff">CLI, hook</text>
<line x1="20" y1="824" x2="1030" y2="824" class="rule"/>
<text x="34" y="852" class="f">CHANGES.diff PROMOTE-PLAN.diff</text>
<text x="400" y="852" class="n">what DEV/ changes; the write-back plan</text>
<rect x="880" y="834" width="130" height="25" rx="4" fill="#141414" stroke="#141414" stroke-width="1.2"/><text x="945" y="852" class="n" text-anchor="middle" style="fill:#ffffff">CLI</text>
<line x1="20" y1="870" x2="1030" y2="870" stroke="#141414" stroke-width="1.5"/>
<text x="20" y="898" class="k">harness: CLI, hook and board. Tiers only go up (task upgrade). Templates: .harness/contracts/templates/task/</text>
</svg>
