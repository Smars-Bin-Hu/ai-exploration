<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470">
  <style>text{font-family:Georgia,"Times New Roman",serif;fill:#141414}
.m{fill:#6b6b6b;font-style:italic}.a{fill:#e8590c;font-weight:bold}.inv{fill:#fff;font-family:Arial,sans-serif;font-weight:bold}
.box{fill:#fff;stroke:#141414;stroke-width:1.5}.soft{fill:#f2f1ec}.lit{fill:#fff;stroke:#e8590c;stroke-width:2.2}
.litf{fill:#e8590c}.inkf{fill:#141414}.ln{stroke:#141414;stroke-width:1.5;fill:none}.lna{stroke:#e8590c;stroke-width:2;fill:none}
.lnm{stroke:#cfcfca;stroke-width:1.5;fill:none}.dash{stroke-dasharray:5 5}</style>
  <rect class="box" x="10" y="150" width="170" height="120" rx="8"/>
  <text class="a" x="95.0" y="192.9" text-anchor="middle" style="font-size:17px">Model</text>
  <text class="m" x="95.0" y="215.9" text-anchor="middle" style="font-size:17px">Opus, Sonnet,</text>
  <text class="m" x="95.0" y="238.9" text-anchor="middle" style="font-size:17px">GPT ...</text>
  <text class="a" x="205" y="218" text-anchor="middle" style="font-size:34px">+</text>
  <rect class="lit" x="230" y="20" width="480" height="380" rx="14"/>
  <text class="a" x="470" y="50" text-anchor="middle" style="font-size:18px">Harness: the layer around the model</text>
  <text class="a" x="350" y="84" text-anchor="middle" style="font-size:17px">Vertical</text>
  <text class="m" x="350" y="104" text-anchor="middle" style="font-size:14px">what it can reach and know</text>
  <rect class="box" x="250" y="120" width="200" height="48" rx="8"/>
  <text class="" x="350.0" y="149.2" text-anchor="middle" style="font-size:15px">our domain knowledge</text>
  <rect class="box" x="250" y="182" width="200" height="48" rx="8"/>
  <text class="" x="350.0" y="211.2" text-anchor="middle" style="font-size:15px">tickets and pipelines</text>
  <rect class="box" x="250" y="244" width="200" height="48" rx="8"/>
  <text class="" x="350.0" y="273.2" text-anchor="middle" style="font-size:15px">DEV and IST databases</text>
  <rect class="box" x="250" y="306" width="200" height="48" rx="8"/>
  <text class="" x="350.0" y="335.2" text-anchor="middle" style="font-size:15px">finding the cause</text>
  <text class="a" x="590" y="84" text-anchor="middle" style="font-size:17px">Horizontal</text>
  <text class="m" x="590" y="104" text-anchor="middle" style="font-size:14px">what controls and checks it</text>
  <rect class="box" x="490" y="118" width="200" height="42" rx="8"/>
  <text class="" x="590.0" y="144.2" text-anchor="middle" style="font-size:15px">short task forms</text>
  <rect class="box" x="490" y="172" width="200" height="42" rx="8"/>
  <text class="" x="590.0" y="198.2" text-anchor="middle" style="font-size:15px">approvals</text>
  <rect class="box" x="490" y="226" width="200" height="42" rx="8"/>
  <text class="" x="590.0" y="252.2" text-anchor="middle" style="font-size:15px">guardrails</text>
  <rect class="box" x="490" y="280" width="200" height="42" rx="8"/>
  <text class="" x="590.0" y="306.2" text-anchor="middle" style="font-size:15px">independent review</text>
  <rect class="box" x="490" y="334" width="200" height="42" rx="8"/>
  <text class="" x="590.0" y="360.2" text-anchor="middle" style="font-size:15px">board and reports</text>
  <text class="m" x="360" y="448" text-anchor="middle" style="font-size:15px">A bigger model changes only the left box. The bill goes up; the problems stay.</text>
</svg>
