<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400">
  <style>text{font-family:Georgia,"Times New Roman",serif;fill:#141414}
.m{fill:#6b6b6b;font-style:italic}.a{fill:#e8590c;font-weight:bold}.inv{fill:#fff;font-family:Arial,sans-serif;font-weight:bold}
.box{fill:#fff;stroke:#141414;stroke-width:1.5}.soft{fill:#f2f1ec}.lit{fill:#fff;stroke:#e8590c;stroke-width:2.2}
.litf{fill:#e8590c}.inkf{fill:#141414}.ln{stroke:#141414;stroke-width:1.5;fill:none}.lna{stroke:#e8590c;stroke-width:2;fill:none}
.lnm{stroke:#cfcfca;stroke-width:1.5;fill:none}.dash{stroke-dasharray:5 5}</style>
  <rect class="box" x="10" y="40" width="180" height="250" rx="8"/>
  <text class="a" x="100.0" y="113.5" text-anchor="middle" style="font-size:17px">Model</text>
  <text class="" x="100.0" y="136.4" text-anchor="middle" style="font-size:17px"></text>
  <text class="" x="100.0" y="159.4" text-anchor="middle" style="font-size:17px">thinks and writes</text>
  <text class="" x="100.0" y="182.4" text-anchor="middle" style="font-size:17px"></text>
  <text class="m" x="100.0" y="205.4" text-anchor="middle" style="font-size:17px">Opus, Sonnet,</text>
  <text class="m" x="100.0" y="228.4" text-anchor="middle" style="font-size:17px">GPT …</text>
  <text class="a" x="212" y="176" text-anchor="middle" style="font-size:34px">+</text>
  <rect class="lit" x="236" y="40" width="300" height="250" rx="10"/>
  <text class="a" x="386" y="74" text-anchor="middle" style="font-size:18px">Harness</text>
  <text class="a" x="386" y="112" text-anchor="middle" style="font-size:16px">Vertical:</text>
  <text class="" x="386" y="136" text-anchor="middle" style="font-size:16px">what the agent can</text>
  <text class="" x="386" y="158" text-anchor="middle" style="font-size:16px">reach and know</text>
  <text class="a" x="386" y="204" text-anchor="middle" style="font-size:16px">Horizontal:</text>
  <text class="" x="386" y="228" text-anchor="middle" style="font-size:16px">what keeps it</text>
  <text class="" x="386" y="250" text-anchor="middle" style="font-size:16px">safe and easy to use</text>
  <text class="a" x="560" y="176" text-anchor="middle" style="font-size:34px">=</text>
  <rect class="box" x="584" y="40" width="166" height="250" rx="8"/>
  <text class="a" x="667.0" y="147.9" text-anchor="middle" style="font-size:17px">An agent</text>
  <text class="" x="667.0" y="170.9" text-anchor="middle" style="font-size:17px">you can hand</text>
  <text class="" x="667.0" y="193.9" text-anchor="middle" style="font-size:17px">a whole task to</text>
  <rect class="soft" x="10" y="318" width="740" height="66" rx="10"/>
  <text class="" x="380" y="346" text-anchor="middle" style="font-size:17px">A bigger model changes only the first box.</text>
  <text class="m" x="380" y="370" text-anchor="middle" style="font-size:16px">The bill goes up; the problems stay.</text>
</svg>
